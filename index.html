<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Exam - Grade 5 ICSE</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 800px; margin: auto; }
    h1, h2 { text-align: center; }
    .question { margin-bottom: 15px; }
    .timer { font-size: 1.2em; color: red; text-align: right; }
    .admin-panel, .login-panel, .results-panel { margin-bottom: 30px; padding: 10px; border: 1px solid #ccc; }
    label { display: block; margin-top: 10px; }
    input[type="number"], input[type="text"] { width: 200px; }
    button { margin-top: 10px; }
    .welcome { font-size: 1.1em; margin-bottom: 20px; color: green; text-align: center; }
    .results { font-size: 0.95em; margin-top: 20px; }
    .results pre { background: #f4f4f4; padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Math Exam - Grade 5 (ICSE)</h1>

    <div class="login-panel" id="login-panel">
      <h2>Login</h2>
      <label for="role">Select Role:</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>
      <label for="student-name">Enter Your Name:</label>
      <input type="text" id="student-name">
      <button onclick="loginUser()">Login</button>
    </div>

    <div class="welcome" id="welcome-message" style="display:none;"></div>

    <div class="admin-panel" id="admin-panel" style="display:none;">
      <h2>Admin Configuration</h2>
      <label for="duration">Set Exam Duration (minutes):</label>
      <input type="number" id="duration" value="60">
      <button onclick="generateQuestions()">Start Exam</button>
      <button onclick="viewResults()">View All Results</button>
    </div>

    <div class="timer" id="timer"></div>

    <form id="exam-form" style="display:none;" onsubmit="storeResults(event)"></form>

    <div class="results-panel" id="results-panel" style="display:none;">
      <h2>Submitted Results</h2>
      <div class="results" id="results-content"></div>
    </div>
  </div>

  <script>
    let timerInterval;
    let studentName = '';
    let userRole = '';

    let currentQuestions = [];
    let fullQuestionBank = [];

    async function loadQuestionBank() {
      try {
        const res = await fetch('question_bank.json');
        if (!res.ok) throw new Error('Failed to load question bank');
        fullQuestionBank = await res.json();
      } catch (e) {
        console.error('Could not load question bank:', e);
        // Fallback: leave existing fullQuestionBank empty
        fullQuestionBank = [];
      }
    }

    // Start loading immediately
    loadQuestionBank();

    function loginUser() {
      userRole = document.getElementById('role').value;
      studentName = document.getElementById('student-name').value.trim();
      if (studentName === '') {
        alert('Please enter your name to proceed.');
        return;
      }
      document.getElementById('login-panel').style.display = 'none';
      const welcome = document.getElementById('welcome-message');
      welcome.textContent = `Welcome, ${studentName}!`;
      welcome.style.display = 'block';

      if (userRole === 'admin') {
        document.getElementById('admin-panel').style.display = 'block';
      } else {
        document.getElementById('admin-panel').style.display = 'none';
        generateQuestions();
      }
    }

    async function generateQuestions() {
      // ensure question bank loaded
      if (!fullQuestionBank || fullQuestionBank.length === 0) {
        await loadQuestionBank();
      }

      let durationMinutes;
      if (userRole === 'admin') {
        durationMinutes = parseInt(document.getElementById('duration').value) || 60;
        localStorage.setItem('math_exam_duration', durationMinutes);
      } else {
        durationMinutes = parseInt(localStorage.getItem('math_exam_duration')) || 60;
      }

      // Use minutes for timer, but choose a reasonable number of questions
      // number of questions = min(bank size, max(10, floor(durationMinutes)))
      const numQuestions = Math.min(fullQuestionBank.length, Math.max(10, Math.floor(durationMinutes)));

      // Shuffle without mutating original array
      const shuffled = fullQuestionBank.slice().sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, numQuestions);

      const form = document.getElementById('exam-form');
      form.innerHTML = '';
      currentQuestions.forEach((item, index) => {
        const pts = item.points || 1;
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `<label>${index + 1}. ${item.q} <em>(${pts} pts)</em></label><input type="text" name="q${index + 1}">`;
        form.appendChild(div);
      });
      form.innerHTML += '<button type="submit">Submit Answers</button>';
      form.style.display = 'block';
      document.getElementById('timer').style.display = 'block';

      const endTime = Date.now() + durationMinutes * 60000;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = endTime - Date.now();
        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer').textContent = 'Time is up!';
          form.submit();
        } else {
          const minutes = Math.floor(remaining / 60000);
          const seconds = Math.floor((remaining % 60000) / 1000);
          document.getElementById('timer').textContent = `Time Remaining: ${minutes}m ${seconds}s`;
        }
      }, 1000);
    }

    function normalizeAnswer(s) {
      if (typeof s !== 'string') return String(s).trim().toLowerCase();
      return s.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function storeResults(event) {
      event.preventDefault();
      const formData = new FormData(document.getElementById('exam-form'));
      const answers = {};
      let score = 0;
      let totalPoints = 0;
      let feedback = '';

      // compute total possible points
      currentQuestions.forEach(q => { totalPoints += (q.points || 1); });

      formData.forEach((value, key) => {
        answers[key] = value;
        const index = parseInt(key.replace('q', '')) - 1;
        const qObj = currentQuestions[index];
        const correct = qObj && qObj.a ? qObj.a : '';
        const userAns = value ? value.trim() : '';
        const normUser = normalizeAnswer(userAns);
        const normCorrect = normalizeAnswer(correct);
        let awarded = 0;

        if (normUser === normCorrect) {
          awarded = qObj.points || 1;
          score += awarded;
          feedback += `${key}: Correct (+${awarded})\n`;
        } else if (qObj.partials && Array.isArray(qObj.partials)) {
          // check partial matches
          let gotPartial = false;
          for (const p of qObj.partials) {
            if (normalizeAnswer(p.answer) === normUser) {
              awarded = p.credit || 0;
              score += awarded;
              feedback += `${key}: Partially correct (+${awarded})\n`;
              gotPartial = true;
              break;
            }
          }
          if (!gotPartial) {
            feedback += `${key}: Incorrect (Your answer: ${userAns}, Correct: ${correct})\n`;
          }
        } else {
          feedback += `${key}: Incorrect (Your answer: ${userAns}, Correct: ${correct})\n`;
        }
      });

      const result = {
        student: studentName,
        answers: answers,
        score: score,
        totalPoints: totalPoints,
        feedback: feedback,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem(`math_exam_${studentName}`, JSON.stringify(result));
      alert(`Your answers have been submitted successfully!\nScore: ${score}/${totalPoints} points`);

      const blob = new Blob([`Student: ${studentName}\nScore: ${score}/${totalPoints} points\n\nFeedback:\n${feedback}`], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${studentName}_score_report.txt`;
      link.click();
    }

    function viewResults() {
      const resultsPanel = document.getElementById('results-panel');
      const resultsContent = document.getElementById('results-content');
      resultsContent.innerHTML = '';
      for (let key in localStorage) {
        if (key.startsWith('math_exam_')) {
          const data = JSON.parse(localStorage.getItem(key));
          const formatted = `<strong>${data.student}</strong> - ${new Date(data.timestamp).toLocaleString()}<br>Score: ${data.score}/${data.total}<br><pre>${data.feedback}</pre>`;
          resultsContent.innerHTML += formatted;
        }
      }
      resultsPanel.style.display = 'block';
    }
  </script>
</body>
</html>
